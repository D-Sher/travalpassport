<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>2026 Europe Journey | 行程導覽總覽</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  background:#0b0f19;color:#f8fafc;min-height:100vh;
  display:flex;justify-content:center;align-items:flex-start;padding:16px
}
.container{width:min(100%,480px);position:relative}
.page{display:none;opacity:0;transition:opacity .2s ease-in-out}
.page.active{display:block;opacity:1}

.hero{
  background:linear-gradient(145deg,#171e2e 0%,#0d121d 100%);
  border:1px solid rgba(212,175,55,.4);border-radius:28px;
  padding:32px 24px;text-align:center;margin-bottom:24px;
  box-shadow:0 20px 40px -15px rgba(0,0,0,.8),0 0 15px rgba(212,175,55,.1);
  position:relative;overflow:hidden
}
.hero:after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at top right,rgba(212,175,55,.15),transparent 60%);
  pointer-events:none
}
.agency-badge{font-size:13px;letter-spacing:.25em;color:#d4af37;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.flags{font-size:40px;line-height:1.2;margin-bottom:6px}
.title{
  font-size:26px;font-weight:800;
  background:linear-gradient(135deg,#fff 40%,#d4af37 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:.06em
}
.route{font-size:15px;color:#94a3b8;font-weight:500;margin-top:6px;letter-spacing:.08em}
.status{
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:4px 12px;
  background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);
  border-radius:20px;font-size:12px;color:#fbbf24;font-weight:600
}
.status-dot{width:8px;height:8px;background:#fbbf24;border-radius:50%;display:inline-block;box-shadow:0 0 8px #fbbf24}

.alert-box{
  background:linear-gradient(135deg,rgba(239,68,68,.15),rgba(185,28,28,.05));
  border:1.5px solid #ef4444;border-radius:20px;padding:16px 20px;margin-bottom:20px;
  box-shadow:0 8px 20px rgba(239,68,68,.2)
}
.alert-title{font-size:16px;font-weight:800;color:#fca5a5;margin-bottom:6px;display:flex;gap:6px}
.alert-content{font-size:15px;color:#fecdd3;line-height:1.5;font-weight:600}
.alert-content p{margin-bottom:4px}.alert-content p:last-child{margin-bottom:0}

.main-menu{display:flex;flex-direction:column;gap:20px}
.luxury-card{
  background:linear-gradient(135deg,#161e2e,#101623);
  border:1.5px solid rgba(212,175,55,.3);border-radius:24px;padding:28px 24px;
  display:flex;align-items:center;cursor:pointer;box-shadow:0 10px 25px rgba(0,0,0,.5);
  transition:all .2s ease;position:relative
}
.luxury-card:active{transform:scale(.97);border-color:#d4af37;background:#1c273c}
.icon-box{
  width:68px;height:68px;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.3);
  border-radius:20px;display:flex;align-items:center;justify-content:center;
  font-size:38px;margin-right:20px;flex-shrink:0
}
.card-title{font-size:24px;font-weight:800;color:#fff;letter-spacing:.02em}
.card-subtitle{font-size:14px;color:#d4af37;font-weight:600;margin-top:4px}
.arrow{margin-left:auto;font-size:22px;color:#d4af37;font-weight:700}

.subpage-header{display:flex;align-items:center;margin-bottom:16px}
.btn-back{
  background:rgba(212,175,55,.1);color:#d4af37;border:1.5px solid #d4af37;
  padding:10px 18px;border-radius:16px;font-size:16px;font-weight:800;cursor:pointer
}
.subpage-title{font-size:22px;font-weight:800;margin-left:16px;color:#fff}

.date-filter-container{
  display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:16px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none
}
.date-filter-container::-webkit-scrollbar{display:none}
.date-btn{
  background:#131a29;color:#94a3b8;border:1px solid rgba(212,175,55,.2);
  padding:8px 14px;border-radius:20px;font-size:14px;font-weight:700;
  white-space:nowrap;cursor:pointer;transition:all .2s;flex-shrink:0
}
.date-btn.active{background:linear-gradient(135deg,#d4af37,#b38f2a);color:#0b0f19;border-color:#d4af37;box-shadow:0 4px 12px rgba(212,175,55,.3)}

.content-card{
  background:#131a29;border-radius:22px;padding:22px 20px;margin-bottom:16px;
  border:1px solid rgba(212,175,55,.15)
}
.content-card h3{font-size:20px;font-weight:800;margin-bottom:12px;color:#d4af37;border-bottom:1px solid rgba(212,175,55,.2);padding-bottom:8px}
.content-card p{font-size:16px;line-height:1.6;color:#e2e8f0;font-weight:500;margin-bottom:7px}
.content-card p:last-child{margin-bottom:0}

.item{
  padding:14px 0;border-bottom:1px solid rgba(148,163,184,.12)
}
.item:first-child{padding-top:0}.item:last-child{border-bottom:0;padding-bottom:0}
.item-title{font-size:18px;font-weight:800;color:#fff;margin-bottom:6px}
.item-meta{font-size:14px;color:#94a3b8;line-height:1.55}
.badge{
  display:inline-block;padding:4px 9px;border-radius:10px;margin:2px 4px 2px 0;
  font-size:12px;font-weight:800;background:rgba(212,175,55,.1);color:#d4af37;
  border:1px solid rgba(212,175,55,.25)
}
.transport-badge{
  display:inline-block;padding:4px 9px;border-radius:10px;margin:2px 4px 2px 0;
  font-size:12px;font-weight:800;background:rgba(59,130,246,.1);color:#93c5fd;
  border:1px solid rgba(59,130,246,.25)
}
.map-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  margin-top:10px;padding:11px 14px;border-radius:14px;
  background:#d4af37;color:#0b0f19;text-decoration:none;font-weight:800;font-size:14px
}
.map-btn.secondary{background:rgba(212,175,55,.1);color:#d4af37;border:1px solid rgba(212,175,55,.35)}
.route-box{
  background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(15,23,42,.3));
  border:1px solid rgba(96,165,250,.2);border-radius:18px;padding:16px;margin-top:10px
}
.route-line{font-size:17px;font-weight:800;color:#fff;line-height:1.55}
.route-arrow{color:#d4af37;padding:0 4px}
.route-detail{font-size:14px;color:#94a3b8;line-height:1.6;margin-top:7px}
.summary{
  background:rgba(212,175,55,.06);border-left:3px solid #d4af37;
  border-radius:10px;padding:12px 14px;margin-top:12px;
  color:#e2e8f0;font-size:15px;line-height:1.6
}
.empty{color:#64748b;text-align:center;padding:18px 0}

.small-note{font-size:12px;color:#64748b;line-height:1.5;margin-top:12px}
.section-label{
  font-size:12px;letter-spacing:.15em;color:#64748b;font-weight:800;
  margin:18px 2px 8px;text-transform:uppercase
}
</style>
</head>

<div class="container">

    <div id="sight-list"></div>
  </div>


  <!-- ==================== 車站總覽 ==================== -->

    </div>

    <div class="date-filter-container" id="station-dates"></div>

      <div class="alert-title">⚠️ 當日提醒總結</div>
      <div id="station-alert-content" class="alert-content"></div>
    </div>
    <div id="station-list"></div>
  </div>


  <!-- ==================== 路線引導總覽 ==================== -->
  <div id="page-routes" class="page">
    <div class="subpage-header">

      <div id="route-alert-content" class="alert-content"></div>
    </div>
    <div id="route-list"></div>
  </div>

</div>

/* ============================================================
   Google Maps
   ============================================================ */

function mapButton(url, label="📍 Google Maps 導引"){
  if(!url) return "";
  return `<a class="map-btn" href="${url}" target="_blank" rel="noopener">${label}</a>`;
}

function routeButton(url){
  if(!url) return "";
  return `<a class="map-btn" href="${url}" target="_blank" rel="noopener">🗺️ 開啟今日 Google Maps 路線</a>`;
}


/* ============================================================
   共用日期按鈕
   ============================================================ */

function renderDateButtons(containerId, callbackName){
  const box = document.getElementById(containerId);
  box.innerHTML =
    `<button class="date-btn active" onclick="${callbackName}('all',this)">全部</button>` +
    tripDates.map(d => `<button class="date-btn" onclick="${callbackName}('${d}',this)">${d}</button>`).join("");
}

function activateButton(btn){
  if(!btn) return;
  btn.parentElement.querySelectorAll(".date-btn").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
}


/* ============================================================
   景點
   ============================================================ */

function renderSightPage(targetDate="all", btn=null){
  activateButton(btn);

  const list = document.getElementById("sight-list");
  const alert = document.getElementById("sight-alert");
  const alertContent = document.getElementById("sight-alert-content");

  if(targetDate === "all"){
    alert.style.display="none";
    list.innerHTML = tripDates.map(date => renderSightCard(date)).join("");
    return;
  }

  const data = sights[targetDate];
  if(!data){ list.innerHTML='<div class="empty">尚無資料</div>'; return; }

  alertContent.innerHTML = data.summary.map(x=>`<p>${x}</p>`).join("");
  alert.style.display="block";
  list.innerHTML = renderSightCard(targetDate);
}

function renderSightCard(date){
  const data=sights[date];
  if(!data) return "";
  return `
    <div class="content-card">
      <h3>${date} · 景點安排</h3>
      ${data.items.map(item=>`
        <div class="item">
          <div class="item-title">${item[0]}</div>
          <div class="item-meta">${item[1]}</div>
          <span class="badge">${item[2]}</span>
          ${mapButton(item[3])}
        </div>
      `).join("")}
      <div class="summary"><b>提醒總結：</b>${data.summary.join(" ")}</div>
    </div>
  `;
}


/* ============================================================
   車站
   ============================================================ */

function renderStationPage(targetDate="all", btn=null){
  activateButton(btn);

  const list=document.getElementById("station-list");
  const alert=document.getElementById("station-alert");
  const alertContent=document.getElementById("station-alert-content");

  if(targetDate==="all"){
    alert.style.display="none";
    list.innerHTML=tripDates.map(date=>renderStationCard(date)).join("");
    return;
  }

  const data=stations[targetDate];
  if(!data){list.innerHTML='<div class="empty">尚無資料</div>';return;}

  alertContent.innerHTML=data.summary.map(x=>`<p>${x}</p>`).join("");
  alert.style.display="block";
  list.innerHTML=renderStationCard(targetDate);
}

function renderStationCard(date){
  const data=stations[date];
  if(!data) return "";
  return `
    <div class="content-card">
      <h3>${date} · 車站／交通節點</h3>
      ${data.items.map(item=>`
        <div class="item">
          <div class="item-title">🚉 ${item[0]}</div>
          <span class="transport-badge">${item[1]}</span>
          <div class="item-meta">${item[2]}</div>
          ${mapButton(item[3],"📍 Google Maps 車站導引")}
        </div>
      `).join("")}
      <div class="summary"><b>提醒總結：</b>${data.summary.join(" ")}</div>
    </div>
  `;
}


/* ============================================================
   路線
   ============================================================ */

function renderRoutePage(targetDate="all", btn=null){
  activateButton(btn);

  const list=document.getElementById("route-list");
  const alert=document.getElementById("route-alert");
  const alertContent=document.getElementById("route-alert-content");

  if(targetDate==="all"){
    alert.style.display="none";
    list.innerHTML=tripDates.map(date=>renderRouteCard(date)).join("");
    return;
  }

  const data=routes[targetDate];
  if(!data){list.innerHTML='<div class="empty">尚無資料</div>';return;}

  alertContent.innerHTML=data.summary.map(x=>`<p>${x}</p>`).join("");
  alert.style.display="block";
  list.innerHTML=renderRouteCard(targetDate);
}

function renderRouteCard(date){
  const data=routes[date];
  if(!data) return "";

  return `
    <div class="content-card">
      <h3>${date} · 每日路線</h3>

      <div class="route-box">
        <div class="route-line">
          ${data.route.map((x,i)=>`
            ${i>0 ? '<span class="route-arrow">→</span>' : ''}
            ${x}
          `).join("")}
        </div>
        <div class="route-detail">
          <b>交通：</b>${data.transport}<br>
          <b>預估：</b>${data.estimate}
        </div>
        ${routeButton(data.maps)}
      </div>

      <div class="summary">
        <b>行程交通資訊：</b>${data.detail}
      </div>

      <div class="small-note">
        ${data.maps ? "本日路線使用你從 Google Maps 分享的固定網址。" : "尚未設定本日 Google Maps 路線分享網址。"}
      </div>
    </div>
  `;
}


/* ============================================================
   頁面切換
   ============================================================ */

function showPage(pageId){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  const target=document.getElementById("page-"+pageId);
  if(target) target.classList.add("active");
  window.scrollTo(0,0);

  if(pageId==="sights") renderSightPage("all");
  if(pageId==="stations") renderStationPage("all");
  if(pageId==="routes") renderRoutePage("all");
}


/* ============================================================
   初始化
   ============================================================ */

renderDateButtons("sight-dates","renderSightPage");
renderDateButtons("station-dates","renderStationPage");
renderDateButtons("route-dates","renderRoutePage");

</script>
