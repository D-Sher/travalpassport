<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Europe Journey | 行程總覽與每日導覽</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  background:#0b0f19;color:#f8fafc;min-height:100vh;
  display:flex;justify-content:center;align-items:flex-start;padding:16px
}
.container{width:min(100%,480px);position:relative}
.page{display:none;opacity:0;transition:opacity .2s ease-in-out}
.page.active{display:block;opacity:1}

.hero{
  background:linear-gradient(145deg,#171e2e 0%,#0d121d 100%);
  border:1px solid rgba(212,175,55,.4);border-radius:28px;
  padding:32px 24px;text-align:center;margin-bottom:24px;
  box-shadow:0 20px 40px -15px rgba(0,0,0,.8),0 0 15px rgba(212,175,55,.1);
  position:relative;overflow:hidden
}
.hero:after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at top right,rgba(212,175,55,.15),transparent 60%);
  pointer-events:none
}
.agency-badge{font-size:13px;letter-spacing:.25em;color:#d4af37;font-weight:700;text-transform:uppercase;margin-bottom:8px}
.flags{font-size:40px;line-height:1.2;margin-bottom:6px}
.title{
  font-size:26px;font-weight:800;
  background:linear-gradient(135deg,#fff 40%,#d4af37 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:.06em
}
.route{font-size:15px;color:#94a3b8;font-weight:500;margin-top:6px;letter-spacing:.08em}

.alert-box{
  background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(180,83,9,.05));
  border:1.5px solid #f59e0b;border-radius:20px;padding:16px 20px;margin-bottom:20px;
  box-shadow:0 8px 20px rgba(245,158,11,.15)
}
.alert-title{font-size:16px;font-weight:800;color:#fbbf24;margin-bottom:6px;display:flex;gap:6px}
.alert-content{font-size:14px;color:#fef3c7;line-height:1.5;font-weight:500}

.subpage-header{display:flex;align-items:center;margin-bottom:16px}
.btn-back{
  background:rgba(212,175,55,.1);color:#d4af37;border:1.5px solid #d4af37;
  padding:8px 16px;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer
}
.subpage-title{font-size:20px;font-weight:800;margin-left:12px;color:#fff}

.date-filter-container{
  display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:16px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none
}
.date-filter-container::-webkit-scrollbar{display:none}
.date-btn{
  background:#131a29;color:#94a3b8;border:1px solid rgba(212,175,55,.2);
  padding:8px 14px;border-radius:20px;font-size:14px;font-weight:700;
  white-space:nowrap;cursor:pointer;transition:all .2s;flex-shrink:0
}
.date-btn.active{background:linear-gradient(135deg,#d4af37,#b38f2a);color:#0b0f19;border-color:#d4af37;box-shadow:0 4px 12px rgba(212,175,55,.3)}

.content-card{
  background:#131a29;border-radius:22px;padding:22px 20px;margin-bottom:16px;
  border:1px solid rgba(212,175,55,.15)
}
.content-card h3{font-size:20px;font-weight:800;margin-bottom:12px;color:#d4af37;border-bottom:1px solid rgba(212,175,55,.2);padding-bottom:8px}

/* 時間軸線條與節點 */
.timeline{position:relative;padding-left:20px;margin-top:16px;border-left:2px dashed rgba(212,175,55,.3)}
.timeline-item{position:relative;margin-bottom:20px}
.timeline-item:last-child{margin-bottom:0}
.timeline-dot{
  position:absolute;left:-27px;top:2px;width:12px;height:12px;
  border-radius:50%;background:#d4af37;box-shadow:0 0 8px #d4af37
}

.item-title{font-size:17px;font-weight:800;color:#fff;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.item-meta{font-size:14px;color:#94a3b8;line-height:1.5}

.badge{
  display:inline-block;padding:2px 8px;border-radius:8px;
  font-size:11px;font-weight:800;background:rgba(212,175,55,.15);color:#d4af37;
  border:1px solid rgba(212,175,55,.3)
}
.badge.hotel{background:rgba(168,85,247,.15);color:#c084fc;border-color:rgba(168,85,247,.3)}
.badge.station{background:rgba(59,130,246,.15);color:#93c5fd;border-color:rgba(59,130,246,.3)}
.badge.food{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.3)}

.transit-info{
  font-size:12px;color:#d4af37;background:rgba(212,175,55,.05);
  padding:4px 10px;border-radius:6px;margin:8px 0;display:inline-block
}

.map-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  margin-top:6px;padding:6px 12px;border-radius:10px;
  background:rgba(212,175,55,.15);color:#d4af37;border:1px solid rgba(212,175,55,.3);
  text-decoration:none;font-weight:700;font-size:12px
}
.full-map-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:12px;border-radius:14px;background:#d4af37;color:#0b0f19;
  text-decoration:none;font-weight:800;font-size:15px;margin-top:12px
}
</style>
</head>

<body>
<div class="container">

  <!-- 主頁面 -->
  <div id="page-home" class="page active">
    <section class="hero">
      <div class="agency-badge">PRIVATE JOURNEY GUIDE</div>
      <div class="flags">🇮🇹 🇫🇷</div>
      <div class="title">2026 蔚藍海岸慢活 行程導覽</div>
      <div class="route">MILANO · GENOVA · NICE</div>
    </section>

    <!-- 日期選擇頁籤 -->
    <div class="date-filter-container" id="date-buttons"></div>

    <!-- 當日提醒與導覽內容 -->
    <div id="day-alert" class="alert-box" style="display:none">
      <div class="alert-title">⚠️ 當日重要提醒</div>
      <div id="day-alert-content" class="alert-content"></div>
    </div>

    <div id="day-content"></div>
  </div>

</div>

<script>

  "10/16","10/17","10/18","10/19","10/20","10/21",
  "10/22","10/23","10/24","10/25","10/26","10/27","10/28"

      },

        transitMap: "https://www.google.com/maps/dir/?api=1&origin=Milano+Centrale&destination=Hilton+Milan&travelmode=walking"
      },
      {
        name: "Hilton Milan",
        type: "hotel",
        tag: "住宿飯店",
        note: "辦理入住、放置行李與休息",
        map: "https://maps.app.goo.gl/CTvDLYcDfFWfNxHc6",
        transit: "步行 1 分鐘（餐廳位於飯店 1 樓內）",
        transitMap: "https://www.google.com/maps/dir/?api=1&origin=Hilton+Milan&destination=CotoliAMO+Milan&travelmode=walking"
      },
      {
        name: "CotoliAMO",

        tag: "晚餐地點",
        note: "飯店附設義大利餐廳，輕鬆享用晚餐",
        map: "https://maps.app.goo.gl/rPbei9YcnEGtG8WM7",

        transitMap: ""
      }
    ]
  },
  "10/17": {
    summary: ["米蘭市區主景點日；控制在 1 個主景點＋1 個輕鬆區域。"],
    fullMap: "",
    nodes: [
      { name: "Hilton Milan", type: "hotel", tag: "出發", note: "飯店出發", map: "", transit: "搭乘 Metro M3 ➔ Duomo 站" },
      { name: "米蘭主教座堂 (Duomo)", type: "sight", tag: "主景點", note: "參觀教堂與廣場區域", map: "https://maps.app.goo.gl/1BwWX5AbHh28yy7H7", transit: "步行 1 分鐘" },
      { name: "埃馬努埃萊二世拱廊", type: "sight", tag: "輕鬆區域", note: "大教堂旁輕鬆逛街區", map: "https://maps.app.goo.gl/xzRx7fFwCv5wQWSr5", transit: "步行 2 分鐘" },
      { name: "Ristorante Galleria", type: "food", tag: "午餐用餐", note: "義大利餐廳（1987年開幕）", map: "https://maps.app.goo.gl/EyZaBaxgdZJNYJxs7", transit: "步行 3 分鐘" },
      { name: "斯卡拉大劇院 (Teatro alla Scala)", type: "sight", tag: "輕鬆區域", note: "18 世紀豪華劇院，外觀與劇院廣場散步", map: "https://maps.app.goo.gl/UnXheEdWotjZfWuJA", transit: "步行 2 分鐘" },
      { name: "La Corte Romanengo - Salon de thé Manzoni", type: "food", tag: "下午茶/早午餐", note: "百年老字號精緻茶館與法式/義式點心，極具優雅氛圍", map: "https://maps.app.goo.gl/cQpBxgS17Wz8Z48P7", transit: "步行 6 分鐘" },
      { name: "星巴克臻選® 米蘭烘焙工坊", type: "food", tag: "下午茶/參觀", note: "義大利百年郵局改建歐洲最大星巴克，感受工業風烘焙區", map: "https://maps.app.goo.gl/r5styKUNJncvAmP18", transit: "搭乘路面電車 1 號線 / 9 號線" },

      { name: "La Volta at RH Milan", type: "food", tag: "晚餐地點", note: "高評價餐館，適合晚宴", map: "https://maps.app.goo.gl/2WXDwH9QnPzpH5S27", transit: "輕軌 9 號線 ➔ 飯店" }

    fullMap: "",
    nodes: [

      { name: "Pezzi di artiglieria", type: "sight", tag: "觀景台", note: "公園觀景台，可遠眺貝爾加莫下城區全景", map: "https://maps.app.goo.gl/Jvfs6N9M6MZFx1yd8", transit: "步行" },
      { name: "Piazzetta Luigi Angelini", type: "sight", tag: "捷徑走廊", note: "可從此中庭走廊直接通往廣場", map: "https://maps.app.goo.gl/DBSityoEsMeUvjnT8", transit: "步行" },
      { name: "Piazza Vecchia (老城廣場)", type: "sight", tag: "輕鬆區域", note: "古城廣場散步與休息", map: "https://maps.app.goo.gl/GAMLzZ9RnEtkszmR7", transit: "步行" },
      { name: "Carmen Gelato - Colleoni", type: "food", tag: "冰淇淋/甜點", note: "當地熱門義大利冰淇淋店", map: "https://maps.app.goo.gl/pDy86qQXNP8UkHyJ6", transit: "搭乘纜車/公車返回 Bergamo 火車站" },
      { name: "Bergamo 火車站", type: "station", tag: "回程樞紐", note: "搭乘 Trenord 返回米蘭中央車站", map: "", transit: "火車約 1 小時" }

  /* 其他日期依此類推延伸 */
};

function renderDateButtons() {
  const box = document.getElementById("date-buttons");
  box.innerHTML = 
    `<button class="date-btn active" onclick="renderDay('all', this)">全部行程</button>` +
    tripDates.map(d => `<button class="date-btn" onclick="renderDay('${d}', this)">${d}</button>`).join("");
}

function renderDay(targetDate, btn) {
  if(btn) {
    btn.parentElement.querySelectorAll(".date-btn").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
  }

  const container = document.getElementById("day-content");
  const alertBox = document.getElementById("day-alert");
  const alertContent = document.getElementById("day-alert-content");

  if(targetDate === "all") {
    alertBox.style.display = "none";
    container.innerHTML = tripDates.map(date => renderDayCard(date)).join("");
    return;
  }

  const data = itineraries[targetDate];
  if(!data) {
    alertBox.style.display = "none";
    container.innerHTML = '<div style="color:#64748b;text-align:center;padding:20px;">尚無本日行程資料</div>';
    return;
  }

  alertContent.innerHTML = data.summary.map(x => `<p>${x}</p>`).join("");
  alertBox.style.display = "block";
  container.innerHTML = renderDayCard(targetDate);
}

function renderDayCard(date) {
  const data = itineraries[date];
  if(!data) return "";

  const getTypeBadge = (type, tag) => {
    if(type === 'hotel') return `<span class="badge hotel">🏨 ${tag}</span>`;
    if(type === 'station') return `<span class="badge station">🚉 ${tag}</span>`;
    if(type === 'food') return `<span class="badge food">🍽️ ${tag}</span>`;
    return `<span class="badge">📍 ${tag}</span>`;
  };

  return `
    <div class="content-card">
      <h3>${date} 行程與路線導引</h3>
      
      <div class="timeline">
        ${data.nodes.map(node => `
          <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="item-title">
              ${node.name}${getTypeBadge(node.type, node.tag)}
            </div>
            <div class="item-meta">${node.note}</div>${node.map ? `<a class="map-btn" href="${node.map}" target="_blank">📍 地點導航</a>` : ''}
            ${node.transit ? `<br><div class="transit-info">⬇️ ${node.transit}</div>` : ''}
          </div>
        `).join("")}
      </div>

      ${data.fullMap ? `<a class="full-map-btn" href="${data.fullMap}" target="_blank">🗺️ 開啟今日 Google Maps 總路線</a>` : ''}
    </div>
  `;
}

// 初始化
renderDateButtons();
renderDay("all");
</script>
</body>
</html>
