<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  background:#0b0f19;
  color:#f8fafc;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:16px
}

.container{
  width:min(100%,480px);
  position:relative
}

.page{
  display:none;
  opacity:0;
  transition:opacity .2s ease-in-out
}

.page.active{
  display:block;
  opacity:1
}

/* =========================
   HERO
========================= */

.hero{
  background:linear-gradient(145deg,#171e2e 0%,#0d121d 100%);
  border:1px solid rgba(212,175,55,.4);
  border-radius:28px;
  padding:32px 24px;
  text-align:center;
  margin-bottom:24px;
  box-shadow:
    0 20px 40px -15px rgba(0,0,0,.8),
    0 0 15px rgba(212,175,55,.1);
  position:relative;
  overflow:hidden
}

.hero:after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(
    circle at top right,
    rgba(212,175,55,.15),
    transparent 60%
  );
  pointer-events:none
}

.agency-badge{
  font-size:13px;
  letter-spacing:.25em;
  color:#d4af37;
  font-weight:700;
  text-transform:uppercase;
  margin-bottom:8px
}

.flags{
  font-size:40px;
  line-height:1.2;
  margin-bottom:6px
}

.title{
  font-size:26px;
  font-weight:800;
  background:linear-gradient(135deg,#fff 40%,#d4af37 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  letter-spacing:.06em
}

.route{
  font-size:15px;
  color:#94a3b8;
  font-weight:500;
  margin-top:6px;
  letter-spacing:.08em
}

/* =========================
   ALERT
========================= */

.alert-box{
  background:linear-gradient(
    135deg,
    rgba(245,158,11,.15),
    rgba(180,83,9,.05)
  );
  border:1.5px solid #f59e0b;
  border-radius:20px;
  padding:16px 20px;
  margin-bottom:20px;
  box-shadow:0 8px 20px rgba(245,158,11,.15)
}

.alert-title{
  font-size:16px;
  font-weight:800;
  color:#fbbf24;
  margin-bottom:6px;
  display:flex;
  gap:6px
}

.alert-content{
  font-size:14px;
  color:#fef3c7;
  line-height:1.5;
  font-weight:500
}

/* =========================
   DATE BUTTON
========================= */

.date-filter-container{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:12px;
  margin-bottom:16px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none
}

.date-filter-container::-webkit-scrollbar{
  display:none
}

.date-btn{
  background:#131a29;
  color:#94a3b8;
  border:1px solid rgba(212,175,55,.2);
  padding:8px 14px;
  border-radius:20px;
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  cursor:pointer;
  transition:all .2s;
  flex-shrink:0
}

.date-btn.active{
  background:linear-gradient(135deg,#d4af37,#b38f2a);
  color:#0b0f19;
  border-color:#d4af37;
  box-shadow:0 4px 12px rgba(212,175,55,.3)
}

/* =========================
   CONTENT
========================= */

.content-card{
  background:#131a29;
  border-radius:22px;
  padding:22px 20px;
  margin-bottom:16px;
  border:1px solid rgba(212,175,55,.15)
}

.content-card h3{
  font-size:20px;
  font-weight:800;
  margin-bottom:12px;
  color:#d4af37;
  border-bottom:1px solid rgba(212,175,55,.2);
  padding-bottom:8px
}

/* =========================
   TIMELINE
========================= */

.timeline{
  position:relative;
  padding-left:20px;
  margin-top:16px;
  border-left:2px dashed rgba(212,175,55,.3)
}

.timeline-item{
  position:relative;
  margin-bottom:20px
}

.timeline-item:last-child{
  margin-bottom:0
}

.timeline-dot{
  position:absolute;
  left:-27px;
  top:2px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#d4af37;
  box-shadow:0 0 8px #d4af37
}

.item-title{
  font-size:17px;
  font-weight:800;
  color:#fff;
  margin-bottom:4px;
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap
}

.item-meta{
  font-size:14px;
  color:#94a3b8;
  line-height:1.5
}

/* =========================
   BADGES
========================= */

.badge{
  display:inline-block;
  padding:2px 8px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
  background:rgba(212,175,55,.15);
  color:#d4af37;
  border:1px solid rgba(212,175,55,.3)
}

.badge.hotel{
  background:rgba(168,85,247,.15);
  color:#c084fc;
  border-color:rgba(168,85,247,.3)
}

.badge.station{
  background:rgba(59,130,246,.15);
  color:#93c5fd;
  border-color:rgba(59,130,246,.3)
}

.badge.food{
  background:rgba(239,68,68,.15);
  color:#fca5a5;
  border-color:rgba(239,68,68,.3)
}

/* =========================
   TRANSIT
========================= */

.transit-info{
  font-size:12px;
  color:#d4af37;
  background:rgba(212,175,55,.08);
  padding:6px 12px;
  border-radius:8px;
  margin:8px 0;
  display:inline-flex;
  align-items:center;
  gap:4px;
  border:1px solid rgba(212,175,55,.2);
  text-decoration:none;
  transition:all .2s
}

.transit-info:hover{
  background:rgba(212,175,55,.2)
}

/* =========================
   STOPS BUTTON
========================= */

.stops-toggle{
  width:100%;
  margin-top:8px;
  padding:9px 12px;
  border-radius:10px;
  border:1px solid rgba(59,130,246,.25);
  background:rgba(59,130,246,.08);
  color:#93c5fd;
  font-size:13px;
  font-weight:800;
  text-align:left;
  cursor:pointer;
  transition:all .2s
}

.stops-toggle:hover{
  background:rgba(59,130,246,.15)
}

.stops-panel{
  display:none;
  margin-top:8px;
  padding:12px;
  border-radius:12px;
  background:#0d1422;
  border:1px solid rgba(59,130,246,.18)
}

.stops-panel.open{
  display:block
}

.stops-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  padding-bottom:8px;
  border-bottom:1px solid rgba(148,163,184,.15)
}

.stops-title{
  font-size:13px;
  font-weight:800;
  color:#e2e8f0
}

.stops-count{
  font-size:11px;
  color:#64748b;
  background:rgba(148,163,184,.08);
  padding:3px 7px;
  border-radius:6px
}

.stop-list{
  list-style:none;
  margin:0;
  padding:0
}

.stop-item{
  position:relative;
  padding:7px 0 7px 25px;
  font-size:13px;
  color:#cbd5e1;
  line-height:1.4
}

.stop-item:before{
  content:"";
  position:absolute;
  left:4px;
  top:13px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#64748b;
  border:2px solid #0d1422
}

.stop-item:not(:last-child):after{
  content:"";
  position:absolute;
  left:7px;
  top:21px;
  width:2px;
  height:calc(100% - 7px);
  background:rgba(100,116,139,.35)
}

.stop-item.start{
  color:#f8fafc;
  font-weight:800
}

.stop-item.start:before{
  background:#22c55e
}

.stop-item.end{
  color:#f8fafc;
  font-weight:800
}

.stop-item.end:before{
  background:#ef4444
}

.stop-label{
  font-size:10px;
  color:#64748b;
  margin-left:5px
}

/* =========================
   MAP BUTTON
========================= */

.map-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin-top:6px;
  padding:6px 12px;
  border-radius:10px;
  background:rgba(212,175,55,.15);
  color:#d4af37;
  border:1px solid rgba(212,175,55,.3);
  text-decoration:none;
  font-weight:700;
  font-size:12px
}

.full-map-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  padding:12px;
  border-radius:14px;
  background:#d4af37;
  color:#0b0f19;
  text-decoration:none;
  font-weight:800;
  font-size:15px;
  margin-top:12px

/* =========================
   MOBILE
========================= */

</style>

/* ============================================================
   日期按鈕
============================================================ */

function renderDateButtons(){

  const box =
    document.getElementById("date-buttons");

  box.innerHTML =
    `<button
      class="date-btn active"
      onclick="renderDay('all', this)">
      全部行程
    </button>` +

    tripDates
      .map(date =>
        `<button
          class="date-btn"
          onclick="renderDay('${date}', this)">
          ${date}
        </button>`
      )
      .join("");
}


/* ============================================================
   取得交通圖示
============================================================ */

function getTransitIcon(mode){

  return transitIcons[mode] || "🚉";

}


/* ============================================================
   交通資訊渲染
============================================================ */

function renderTransit(node, index){

  if(!node.transit){
    return "";
  }

  const t = node.transit;

  const icon =
    getTransitIcon(t.mode);

  const lineText =
    t.line
      ? ` ${t.line}`
      : "";

  const routeText =
    t.from && t.to
      ? `${t.from} → ${t.to}`
      : "";

  const durationText =
    t.duration
      ? `｜${t.duration}`
      : "";

  const summary =
    `${icon}${lineText}｜${routeText}${durationText}`;


  let html = `
    <br>

    ${
      node.transitMap
      ?

      `<a
        class="transit-info"
        href="${node.transitMap}"
        target="_blank">

        ${summary} 🗺️

      </a>`

      :

      `<div class="transit-info">

        ${summary}

      </div>`
    }
  `;


  /* ========================================================
     行經站點
  ======================================================== */

  if(
    Array.isArray(t.stops) &&
    t.stops.length > 0
  ){

    const panelId =
      `stops-${node.name
        .replace(/[^\w\u4e00-\u9fff]/g,"-")
        .replace(/-+/g,"-")
        .substring(0,30)
      }-${index}`;


    const stopItems =
      t.stops
        .map((stop, i) => {

          let cls = "stop-item";

          if(i === 0){
            cls += " start";
          }

          if(i === t.stops.length - 1){
            cls += " end";
          }

          let label = "";

          if(i === 0){
            label =
              `<span class="stop-label">起點</span>`;
          }
          else if(i === t.stops.length - 1){
            label =
              `<span class="stop-label">終點</span>`;
          }

          return `
            <li class="${cls}">
              ${stop}
              ${label}
            </li>
          `;

        })
        .join("");


    html += `

      <button
        class="stops-toggle"
        onclick="toggleStops('${panelId}', this)">

        🚉 行經站點
        <span style="float:right">＋</span>

      </button>


      <div
        id="${panelId}"
        class="stops-panel">

        <div class="stops-header">

          <div class="stops-title">
            ${icon} ${t.line || "交通路線"}
          </div>

          <div class="stops-count">
            ${Math.max(t.stops.length - 1, 0)} 段
          </div>

        </div>

        <ul class="stop-list">
          ${stopItems}
        </ul>

      </div>

    `;
  }


  return html;

}


/* ============================================================
   展開 / 收合站點
============================================================ */

function toggleStops(id, button){

  const panel =
    document.getElementById(id);

  if(!panel){
    return;
  }

  const isOpen =
    panel.classList.toggle("open");

  button.innerHTML =
    isOpen

      ? `🚉 收起行經站點
         <span style="float:right">－</span>`

      : `🚉 行經站點
         <span style="float:right">＋</span>`;
}


/* ============================================================
   類型 Badge
============================================================ */

function getTypeBadge(type, tag){

  if(type === "hotel"){

    return `
      <span class="badge hotel">
        🏨 ${tag}
      </span>
    `;

  }

  if(type === "station"){

    return `
      <span class="badge station">
        🚉 ${tag}
      </span>
    `;

  }

  if(type === "food"){

    return `
      <span class="badge food">
        🍽️ ${tag}
      </span>
    `;

  }

  return `
    <span class="badge">
      📍 ${tag}
    </span>
  `;
}


/* ============================================================
   Render Day
============================================================ */

function renderDay(targetDate, btn){

  if(btn){

    btn.parentElement
      .querySelectorAll(".date-btn")
      .forEach(x =>
        x.classList.remove("active")
      );

    btn.classList.add("active");
  }


  const container =
    document.getElementById("day-content");

  const alertBox =
    document.getElementById("day-alert");

  const alertContent =
    document.getElementById("day-alert-content");


  /* 全部行程 */

  if(targetDate === "all"){

    alertBox.style.display =
      "none";

    container.innerHTML =
      tripDates
        .map(date =>
          renderDayCard(date)
        )
        .join("");

    return;
  }


  const data =
    itineraries[targetDate];


  if(!data){

    alertBox.style.display =
      "none";

    container.innerHTML = `

      <div
        style="
          color:#64748b;
          text-align:center;
          padding:20px;
        ">

        尚無本日行程資料

      </div>

    `;

    return;
  }


  alertContent.innerHTML =
    data.summary
      .map(x => `<p>${x}</p>`)
      .join("");


  alertBox.style.display =
    "block";


  container.innerHTML =
    renderDayCard(targetDate);
}


/* ============================================================
   Render Day Card
============================================================ */

function renderDayCard(date){

  const data =
    itineraries[date];


  if(!data){
    return "";
  }


  return `

    <div class="content-card">

      <h3>
        ${date} 行程與路線導引
      </h3>


      <div class="timeline">

        ${

          data.nodes

            .map((node, index) => `

              <div class="timeline-item">

                <div class="timeline-dot"></div>


                <div class="item-title">

                  ${node.name}

                  ${getTypeBadge(
                    node.type,
                    node.tag
                  )}

                </div>


                <div class="item-meta">

                  ${node.note}

                </div>


                ${
                  node.map

                  ?

                  `<a
                    class="map-btn"
                    href="${node.map}"
                    target="_blank">

                    📍 地點導航

                  </a>`

                  :

                  ""
                }


                ${

                  renderTransit(
                    node,
                    index
                  )

                }

              </div>

            `)

            .join("")

        }

      </div>


      ${

        data.fullMap

        ?

        `<a
          class="full-map-btn"
          href="${data.fullMap}"
          target="_blank">

          🗺️ 開啟今日 Google Maps 總路線

        </a>`

        :

        ""

      }

    </div>

  `;
}


/* ============================================================
   初始化
============================================================ */

renderDateButtons();

renderDay("all");

</script>

</body>
</html>
